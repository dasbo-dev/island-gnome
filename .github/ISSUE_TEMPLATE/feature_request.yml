name: Feature request
description: Suggest something the extension should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check [known limitations](https://github.com/dasbo-dev/island-gnome/blob/main/docs/limitations.md)
        first. Some gaps are known and documented, Codex permission gating
        above all.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the extension makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including doing nothing, and why that is not enough.
